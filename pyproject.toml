[project]
name = "env-factory"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "马强", email = "maqiangcsu@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "neo4j>=6.0.0",
    "pytest>=9.1.1",
    "python-dotenv>=1.1.0",
]

[project.scripts]
env-factory = "env_factory:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
